<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#05070c" />
      <stop offset="100%" stop-color="#0d1527" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#7000ff" />
      <stop offset="100%" stop-color="#ff0055" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  
  <!-- Cyber Grid Lines -->
  <path d="M 0,128 L 512,128 M 0,256 L 512,256 M 0,384 L 512,384 M 128,0 L 128,512 M 256,0 L 256,512 M 384,0 L 384,512" 
        stroke="#00f0ff" stroke-opacity="0.08" stroke-width="2" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="240" r="180" fill="url(#glow)" />

  <!-- Outer Cyber Ring -->
  <circle cx="256" cy="240" r="190" fill="none" stroke="#00f0ff" stroke-dasharray="12 8 4 8" stroke-width="3" stroke-opacity="0.5" />
  
  <!-- Shield Emblem -->
  <path d="M 256,90 L 370,140 V 250 C 370,330 310,390 256,420 C 202,390 142,330 142,250 V 140 Z" 
        fill="none" stroke="url(#shieldGrad)" stroke-width="12" stroke-linejoin="round" filter="url(#shadow)" />
  
  <!-- Smart Grid Core Topology Node Matrix -->
  <!-- Central Hub -->
  <circle cx="256" cy="230" r="22" fill="#00f0ff" />
  <circle cx="256" cy="230" r="32" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="6 4" />

  <!-- Satellite Nodes -->
  <circle cx="200" cy="180" r="12" fill="#7000ff" />
  <circle cx="312" cy="180" r="12" fill="#00ff88" />
  <circle cx="190" cy="290" r="12" fill="#ffaa00" />
  <circle cx="322" cy="290" r="12" fill="#ff0055" />

  <!-- Node Interconnections -->
  <path d="M 256,230 L 200,180 M 256,230 L 312,180 M 256,230 L 190,290 M 256,230 L 322,290 M 200,180 L 312,180 M 190,290 L 322,290" 
        stroke="#00f0ff" stroke-width="3" stroke-opacity="0.7" />

  <!-- Quantum Pulse Radar Pulse -->
  <path d="M 210,140 Q 256,110 302,140" fill="none" stroke="#00f0ff" stroke-width="4" stroke-linecap="round" />
  
  <!-- Text Label Badge -->
  <text x="256" y="470" font-family="'Rajdhani', sans-serif" font-weight="700" font-size="34" fill="#00f0ff" text-anchor="middle" letter-spacing="4">Q-GRID SENTINEL</text>
</svg>
